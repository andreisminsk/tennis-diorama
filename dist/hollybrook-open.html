<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hollybrook Open</title>
<style>
  :root{
    --bg:#101418; --panel:#171d24; --panel2:#1e2630; --line:#2a3441;
    --ink:#dfe7ee; --dim:#8fa1b3; --acc:#3ecfb2; --warn:#f2a352; --bad:#ef6a5a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink);
       font:14px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif; overflow:hidden}
  #app{display:flex; width:100vw; height:100vh}
  #stage{position:relative; flex:1 1 auto; min-width:0}
  #glhost{position:absolute; inset:0}
  canvas{display:block; width:100%; height:100%; image-rendering:pixelated; cursor:grab}
  canvas.drag{cursor:grabbing}

  /* TV-style scoreboard (above canvas, untouched by pixel pass) */
  #scoreboard{position:absolute; top:10px; left:50%; transform:translateX(-50%);
    display:none; align-items:center; gap:14px; padding:8px 14px;
    background:rgba(13,17,22,.82); border:1px solid var(--line); border-radius:6px;
    font:600 15px/1.2 "Avenir Next","Segoe UI",system-ui,sans-serif; white-space:nowrap}
  #scoreboard.on{display:flex}
  .sb-name{color:var(--dim); letter-spacing:.5px}
  .sb-ptr{color:var(--warn); min-width:2.2em; text-align:center}
  .sb-srv{color:var(--acc)}
  .sb-cell{display:flex; gap:12px; align-items:baseline}

  /* side panel */
  #panel{flex:0 0 312px; overflow-y:auto; background:var(--panel);
         border-left:1px solid var(--line); padding:12px 14px 24px}
  #panel h1{font-size:16px; letter-spacing:1px; color:var(--ink); margin-bottom:2px}
  #panel h1 small{display:block; font-size:11px; font-weight:400; color:var(--dim)}
  .sec{margin-top:14px; padding:10px 12px; background:var(--panel2);
       border:1px solid var(--line); border-radius:8px}
  .sec h2{font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
          color:var(--acc); margin-bottom:8px}
  .row{display:flex; gap:8px; align-items:center; margin:6px 0}
  .row label{flex:0 0 92px; color:var(--dim); font-size:12px}
  .row .val{min-width:2.4em; text-align:right; font-variant-numeric:tabular-nums}
  select,button{background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:5px; padding:4px 8px; font:inherit; font-size:13px}
  select:focus,button:focus{outline:1px solid var(--acc)}
  button{cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc); color:#0b1512; border-color:var(--acc)}
  button:disabled{opacity:.4; cursor:default}
  button.wide{flex:1 1 auto}
  .seg{display:flex; gap:4px}
  .seg button{flex:1; padding:4px 2px}
  input[type=range]{flex:1; accent-color:var(--acc)}
  code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; color:var(--dim)}
  #stats{font-size:12px; color:var(--dim)}
  #stats b{color:var(--ink)}
  #feed{height:180px; overflow-y:auto; font-size:12px; line-height:1.5}
  #feed li{list-style:none; padding:3px 0; border-bottom:1px dashed #232b35}
  #feed .t{color:var(--dim); font-family:ui-monospace,Menlo,monospace; margin-right:6px}
  #feed .big{color:var(--acc)}
  #feed .warn{color:var(--warn)}
  .hint{font-size:11px; color:var(--dim)}

  /* phone: panel stacks below the canvas */
  @media (max-width:720px){
    body{overflow:auto}
    #app{flex-direction:column; height:auto; min-height:100vh}
    #stage{flex:0 0 58vh; min-height:58vh}
    #panel{flex:1 1 auto; border-left:none; border-top:1px solid var(--line)}
    #feed{height:140px}
  }
  /* forced variants (QA boot params) */
  body.nomenu #panel, body.nomenu #scoreboard{display:none}
  body.phone #app{flex-direction:column; height:auto; min-height:100vh}
  body.phone #stage{flex:0 0 58vh; min-height:58vh}
  body.phone #panel{flex:1 1 auto; border-left:none; border-top:1px solid var(--line)}
  body.phone #scoreboard{font-size:12px; gap:8px; padding:6px 8px; max-width:96%; overflow-x:auto}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="glhost"></div>
    <div id="scoreboard">
      <span class="sb-cell"><span class="sb-name" data-sb="name0">—</span
        ><span class="sb-srv" data-sb="srv0"></span><span class="sb-ptr" data-sb="ptr0">0</span></span>
      <span class="sb-cell"><span class="sb-name" data-sb="name1">—</span
        ><span class="sb-srv" data-sb="srv1"></span><span class="sb-ptr" data-sb="ptr1">0</span></span>
      <span class="sb-cell"><code data-sb="games">0–0</code></span>
      <span class="sb-cell"><code data-sb="sets">—</code></span>
    </div>
  </div>
  <div id="panel">
    <h1> HOLLYBROOK OPEN <small>singles final — club diorama</small></h1>

    <div class="sec" id="sec-match">
      <h2>Match</h2>
      <div class="row"><label for="fmt">Format</label>
        <select id="fmt" class="wide">
          <option value="short">Short set (FAST4)</option>
          <option value="set">One set</option>
          <option value="bo3" selected>Best of 3</option>
        </select></div>
      <div class="row"><label for="p0">Player 1</label><select id="p0" class="wide"></select></div>
      <div class="row"><label for="p1">Player 2</label><select id="p1" class="wide"></select></div>
      <div class="row">
        <button id="btnNew" class="wide on">New match</button>
        <button id="btnPause">Pause</button></div>
      <div class="row"><label for="spd">Speed</label>
        <input id="spd" type="range" min="0.5" max="8" step="0.5" value="1">
        <span class="val" id="spdV">1×</span></div>
      <div class="row"><label class="hint" style="flex:1">
        <input type="checkbox" id="skipCer"> Skip ceremony</label>
        <label class="hint"><input type="checkbox" id="autoNext" checked> Auto-next</label></div>
    </div>

    <div class="sec" id="sec-court">
      <h2>Court &amp; sky</h2>
      <div class="row"><label for="surf">Surface</label>
        <select id="surf" class="wide">
          <option value="grass">Grass</option><option value="clay">Clay</option>
          <option value="hard" selected>Hard</option><option value="carpet">Carpet</option>
        </select></div>
      <div class="row"><label for="tod">Time of day</label>
        <select id="tod" class="wide">
          <option value="day" selected>Day</option>
          <option value="dusk">Dusk</option><option value="night">Night</option>
        </select></div>
    </div>

    <div class="sec" id="sec-coach">
      <h2>Coach</h2>
      <div class="seg" id="tactic">
        <button data-tac="auto" class="on" disabled>Auto</button>
        <button data-tac="go" disabled>Go for it</button>
        <button data-tac="safe" disabled>Safe</button>
        <button data-tac="net" disabled>Rush net</button>
        <button data-tac="drop" disabled>Drop</button>
        <button data-tac="lob" disabled>Lob</button>
      </div>
      <div class="row"><label for="srvDir">Serve dir</label>
        <select id="srvDir" class="wide" disabled>
          <option value="auto" selected>Auto</option>
          <option value="wide">Wide</option><option value="body">Body</option>
          <option value="tee">T</option>
        </select></div>
      <div class="row">
        <button id="btnAim" class="wide" disabled>Aim next shot (click court)</button>
        <button id="btnChal" disabled>Challenge</button></div>
    </div>

    <div class="sec" id="sec-cam">
      <h2>Camera</h2>
      <div class="seg" id="camMode">
        <button data-cam="tv">TV</button>
        <button data-cam="club" class="on">Club</button>
        <button data-cam="close">Close</button>
      </div>
      <div class="row"><label for="pix">Pixel size</label>
        <input id="pix" type="range" min="1" max="6" step="1" value="2">
        <span class="val" id="pixV">2</span></div>
      <div class="hint">Q / E turn · wheel zoom · drag orbit (vertical = tilt) · shift-drag pan</div>
    </div>

    <div class="sec"><h2>Match centre</h2><div id="stats">No match yet.</div></div>
    <div class="sec"><h2>Commentary feed</h2><ul id="feed"></ul></div>
  </div>
</div>
<script>
(function(){
'use strict';
// ===== cfg.js =====
// cfg.js — HB.CFG: constants, world dims, 90-colour palette, roster, sponsors (ARCH §10).
// First file in the build: creates the single window.HB root with HB.reg().
(function () {
  if (window.HB) return;
  var HBroot = {
    version: 'p0',
    api: {},
    reg: function (key, api) {
      if (HBroot.api[key]) throw new Error('HB.reg: duplicate key "' + key + '"');
      HBroot.api[key] = api;
    }
  };
  window.HB = HBroot;
  // HB.CORE hosts bus-adjacent engine modules; created here (cfg.js loads first)
  // so core-*.js can attach: sched / pipeline / camera / light / boot.
  HBroot.CORE = {};
})();

HB.CFG = (function () {
  var PAL = [
    // greys 8
    '#07080a', '#101317', '#1a1f26', '#262d36', '#39424e', '#525e6c', '#74818f', '#a3abb5',
    // skin/hair 6
    '#f3c9a5', '#dfa07b', '#b57a52', '#8a5a3b', '#2e2a26', '#c8b08b',
    // grass 8
    '#1d4a1e', '#2a6a26', '#3f8a2f', '#57a838', '#77c14a', '#a3d36a', '#cde694', '#5e8f43',
    // clay 8
    '#6e3320', '#8a4a2b', '#a05f38', '#b87344', '#ce8d58', '#e2a874', '#f2c692', '#57391f',
    // hard 7
    '#1f5f8a', '#2f7fb0', '#4d9fce', '#7db9de', '#1a3a55', '#b8d9ec', '#2a4a68',
    // carpet 6
    '#382a6e', '#4d3f92', '#6a5cb0', '#8b7ecb', '#241a4a', '#b3a5e0',
    // court paint 8
    '#1a4a7a', '#2b63a0', '#3a7ab8', '#4d8fc4', '#6aa6d2', '#8fbfe0', '#b8d8ee', '#12335a',
    // kit accents 16
    '#c8102e', '#e8365a', '#f2f2f2', '#111318', '#f7c531', '#f2a007', '#e2591f', '#8a2be2',
    '#00a3c8', '#28c76f', '#1e3a8a', '#64748b', '#f28cb1', '#7fb069', '#d95d39', '#3ecfb2',
    // wood/stone 12
    '#6b4a2f', '#85613f', '#a37c53', '#c19a6b', '#7d7469', '#96897c', '#b2a698', '#d4cabb',
    '#4a423b', '#5e564d', '#8f8578', '#cfc5b4',
    // foliage 6
    '#14330f', '#1f4d18', '#2f6b20', '#48882b', '#6da83e', '#97c35c',
    // neon/LED 5
    '#ff2f6d', '#ffd23e', '#3ef2d0', '#3ea8ff', '#f2f6ff'
  ];
  if (PAL.length !== 90) throw new Error('HB.CFG: palette must have exactly 90 colours');

  // World (ARCH §5): metres, Y up, court centre at origin.
  // COURT: W total 23.77, baselines z=±11.885, singles x=±4.115, doubles x=±5.485.
  var COURT = { W: 23.77, halfW: 11.885, singlesX: 4.115, dX: 5.485,
                apron: { x: 9.6, z: 17.0 }, netH: { post: 1.07, centre: 0.914 } };

  var island = { rx: 32, rz: 22, rockDepth: 7 };   // 64×44 m ("~64×40" §5; +z for clubhouse)
  var masts = [[-18, -14], [18, -14], [-18, 14], [18, 14]]; // 4 floodlight masts (x,z)

  var roster = [
    { id: 'voss',  name: 'Dario Voss',      sex: 'M', hand: 'R',
      kit: { shirt: '#c8102e', shorts: '#111318', skin: '#f3c9a5', hair: '#2e2a26' },
      pow: 92, place: 78, cons: 70,
      serve: { kphMean: 196, sd: 14, dir: { w: 0.38, b: 0.34, t: 0.28 }, dRate: 0.05 },
      tactic: { net: 34, drop: 22, lob: 18, risk: 74 } },
    { id: 'andersson', name: 'Milo Andersson', sex: 'M', hand: 'L',
      kit: { shirt: '#00a3c8', shorts: '#f2f2f2', skin: '#dfa07b', hair: '#c8b08b' },
      pow: 84, place: 90, cons: 84,
      serve: { kphMean: 188, sd: 12, dir: { w: 0.42, b: 0.30, t: 0.28 }, dRate: 0.03 },
      tactic: { net: 26, drop: 30, lob: 24, risk: 48 } },
    { id: 'anand', name: 'Priya Anand', sex: 'W', hand: 'R',
      kit: { shirt: '#f7c531', shorts: '#1e3a8a', skin: '#b57a52', hair: '#2e2a26' },
      pow: 78, place: 88, cons: 90,
      serve: { kphMean: 172, sd: 12, dir: { w: 0.40, b: 0.32, t: 0.28 }, dRate: 0.03 },
      tactic: { net: 24, drop: 36, lob: 30, risk: 52 } },
    { id: 'kovar', name: 'Jana Kovář', sex: 'W', hand: 'R',
      kit: { shirt: '#28c76f', shorts: '#111318', skin: '#e2a874', hair: '#f2a007' },
      pow: 86, place: 80, cons: 68,
      serve: { kphMean: 178, sd: 15, dir: { w: 0.36, b: 0.36, t: 0.28 }, dRate: 0.06 },
      tactic: { net: 42, drop: 26, lob: 20, risk: 70 } }
  ];

  var sponsors = {
    boards: ['HOLLYBROOK OPEN', 'CLUB NORDIC', 'AERLY', 'BRAMBLE & CO', 'KITE AIRWAYS',
             'MARLOW WATCHES', 'OSPREY SPORT'],
    marquee: 'HOLLYBROOK OPEN — SINGLES FINAL',
    led: ['HOLLYBROOK OPEN', 'WELCOME TO CENTRE COURT', 'PLAY FAIR']
  };

  var bounce = { // per-surface ball params (ARCH §11)
    grass:  { rest: 0.62, mu: 0.35, skid: 0.55, roll: 0.62, speedMix: 1.00, color: '#57a838' },
    clay:   { rest: 0.68, mu: 0.70, skid: 0.10, roll: 0.40, speedMix: 0.93, color: '#b87344' },
    hard:   { rest: 0.71, mu: 0.50, skid: 0.30, roll: 0.50, speedMix: 0.97, color: '#2f7fb0' },
    carpet: { rest: 0.66, mu: 0.28, skid: 0.85, roll: 0.70, speedMix: 1.05, color: '#6a5cb0' }
  };

  var surfaces = ['grass', 'clay', 'hard', 'carpet'];
  var tods = ['day', 'dusk', 'night'];
  var formats = { short: 'FAST4', set: 'One set', bo3: 'Best of 3' };

  var current = { surface: 'hard', tod: 'day' };

  return { palette: PAL, COURT: COURT, island: island, masts: masts, roster: roster,
           sponsors: sponsors, bounce: bounce, surfaces: surfaces, tods: tods,
           formats: formats, current: current, cam: { elev: 31 * Math.PI / 180, az0: 0 } };
})();

HB.reg('cfg', HB.CFG);
// ===== debug.js =====
// debug.js — HB.DEBUG: error capture, boot params, QA hooks (ARCH §14).
HB.DEBUG = {};
window.__hbErrs = window.__hbErrs || [];
window.addEventListener('error', function (e) {
  window.__hbErrs.push({ type: 'error', msg: String(e.message || e),
    where: (e.filename || '') + ':' + (e.lineno || 0) });
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  window.__hbErrs.push({ type: 'promise', msg: String((r && (r.stack || r.message)) || r) });
});

(function () {
  var raw = String(window.location.search || '').replace(/^\?/, '');
  var p = {};
  raw.split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('=');
    var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
    var v = i < 0 ? true : decodeURIComponent(kv.slice(i + 1));
    p[k] = v;
  });
  HB.DEBUG.params = p;
})();

HB.DEBUG.dev = HB.DEBUG.params.dev === '1' || HB.DEBUG.params.dev === true;

HB.DEBUG.ff = function (sec) {
  var s = HB.CORE && HB.CORE.sched;
  if (s && s.ff) s.ff(sec);
};
HB.DEBUG.spawn = function (label) { HB.bus.emit('debug:spawn', { name: String(label) }); };
HB.DEBUG.runMatch = function (fmt, surf) {
  return new Promise(function (res) {
    HB.bus.emit('debug:runmatch', { fmt: fmt, surf: surf, done: res });
  });
};
HB.DEBUG.state = function () {
  var s = HB.CORE && HB.CORE.sched;
  return {
    speed: HB.CORE.speed, paused: !!HB.CORE.paused, tasks: s ? s.count() : 0,
    time: s ? s.now : 0,
    cam: (HB.CORE.camera && HB.CORE.camera.state) ? HB.CORE.camera.state.mode : null,
    tod: (HB.CORE.light && HB.CORE.light.current) ? HB.CORE.light.current : null,
    surface: HB.CFG.current ? HB.CFG.current.surface : null,
    errs: window.__hbErrs.length
  };
};
HB.DEBUG.stats = function () {
  var pl = HB.CORE.pipeline;
  return { pixelSize: pl ? pl.P.pixelSize : null, drawCalls: pl ? pl.P.drawCalls : null,
           rt: pl ? [pl.P.rw, pl.P.rh] : null };
};

// qa=calib — run the calibration harness on the real page (PLAN P4b): table to
// console, kept on HB.DEBUG.calib, breaches tick __hbErrs ('calib:OUT') for QA assert.
HB.DEBUG.runCalib = function (n) {
  var res = HB.RALLY.calibrate(n || 2000);
  HB.DEBUG.calib = res;
  var T = { firstServePct: [60, 65], acePct: [4, 8], dfPct: [2, 4], meanRally: [4, 7] };
  var bad = [];
  Object.keys(res).forEach(function (sf) {
    console.log(sf, JSON.stringify(res[sf]));
    Object.keys(T).forEach(function (k) {
      var v = res[sf][k];
      if (v < T[k][0] || v > T[k][1])
        bad.push(sf + '.' + k + '=' + v + ' not in [' + T[k][0] + ',' + T[k][1] + ']');
    });
  });
  if (bad.length) window.__hbErrs.push({ type: 'calib', msg: 'calib:OUT ' + bad.join('; ') });
  return res;
};

// qa=match&fmt=&surf=&n= — unattended matches; ?qa=wd — forced stall (P5 QA).
HB.DEBUG.qaMatch = function (d) {
  var fmt = HB.DEBUG.params.fmt || 'set';
  var surf = HB.DEBUG.params.surf || HB.CFG.current.surface;
  HB.bus.emit('debug:runmatch', { fmt: fmt, surf: surf, done: d || null });
};
HB.reg('debug', HB.DEBUG);
// ===== util.js =====
// util.js — HB.UTIL: rng, colour (OKLab), lerp/clamp/ease, geometry merge (ARCH §2).
HB.UTIL = (function () {

  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngRange(r, a, b) { return a + (b - a) * r(); }
  function rngPick(r, arr) { return arr[Math.floor(r() * arr.length) % arr.length]; }
  function rngNorm(r) { // Box-Muller, mean 0 sd 1
    var u1 = Math.max(r(), 1e-9), u2 = r();
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(a, b, x) { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16) / 255,
            parseInt(h.slice(2, 4), 16) / 255,
            parseInt(h.slice(4, 6), 16) / 255];
  }
  function rgb2hex(r, g, b) {
    function c2(v) { v = clamp(Math.round(v), 0, 255).toString(16); return v.length < 2 ? '0' + v : v; }
    return '#' + c2(r * 255) + c2(g * 255) + c2(b * 255);
  }

  function cub(t) { return t < 0 ? -Math.pow(-t, 1 / 3) : Math.pow(t, 1 / 3); }
  function oklab(linR, linG, linB) { // linear sRGB -> OKLab
    var l = 0.4122214708 * linR + 0.5363325363 * linG + 0.0514459929 * linB;
    var m = 0.2119034982 * linR + 0.6806995451 * linG + 0.1073969566 * linB;
    var s = 0.0883024619 * linR + 0.2817188376 * linG + 0.6299787005 * linB;
    var l_ = cub(l), m_ = cub(m), s_ = cub(s);
    return [0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
            1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
            0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_];
  }
  function palTable(palette) { // ['#hex',...] -> [{hex, rgb, ok}]
    return palette.map(function (h) {
      var c = hex2rgb(h);
      var lin = [Math.pow(c[0], 2.2), Math.pow(c[1], 2.2), Math.pow(c[2], 2.2)];
      return { hex: h, rgb: c, ok: oklab(lin[0], lin[1], lin[2]) };
    });
  }
  function nearest(pal, r, g, b) { // sRGB [0..1] -> palette index (OKLab NN)
    var L = oklab(Math.pow(r, 2.2), Math.pow(g, 2.2), Math.pow(b, 2.2));
    var best = 1e12, bi = 0;
    for (var i = 0; i < pal.length; i++) {
      var o = pal[i].ok, d0 = L[0] - o[0], d1 = L[1] - o[1], d2 = L[2] - o[2];
      var d = d0 * d0 + d1 * d1 + d2 * d2;
      if (d < best) { best = d; bi = i; }
    }
    return bi;
  }

  // Merge BufferGeometries into one flat (non-indexed) geometry.
  // items: [{g: BufferGeometry, m?: Matrix4, color?: '#hex'|[r,g,b]}, ...]
  // NOTE: applies m in place to non-indexed inputs (clone first if reuse needed).

// ===== core-sched.js =====
// core-sched.js — generator-coroutine scheduler + watchdogs (ARCH §8).
// Yield helpers: HB.wait(s[,max]) HB.until(fn[,max]) HB.par([gens][,max]) HB.seq([gens][,max]).
// Watchdog: an 'until' parked longer than its max (default 25 s) force-resumes and
// emits match:watchdog — a match never hard-locks; pause is the only full stop.
HB.CORE.sched = (function () {
  var tasks = [];
  var seqId = 0;
  var now = 0;        // scaled scheduler seconds since boot
  var delta = 0;      // scheduler seconds advanced by the last step()
  var speed = 1, paused = false, ffLeft = 0;

  function errs(kind, msg) {
    (window.__hbErrs = window.__hbErrs || []).push({ type: kind, msg: msg });
  }

    this.gen = (typeof gen === 'function') ? gen() : gen;

    this.max = opts.max || opts.timeout || 25;   // watchdog budget while parked (s)

        child.onDone(function () { st.n--; });

  }

    var y = untilY(function () { return st.done; }, maxBlock || 40);

  function pump(t) {
    var guard = 64; // synchronous chain limit per step

      var r;
      try { r = t.gen.next(); }
      catch (err) {
        errs('sched', 'task "' + t.labelName + '" threw: ' + String((err && err.message) || err));
        t.finish(); return;
      }
      if (r.done) { t.finish(); return; }

      else if (typeof v === 'number') y = waitY(v, t.max);   // yield 2 == wait 2 s
      else y = waitY(0, t.max);                              // raw yield == rest of step

      }

      }

      t.yield_ = waitY(0, t.max); t.resumeAt = now; t.parkedAt = now; return;

  function step(dtRaw) {

          if (now < t.resumeAt) continue;

        } else {                               // parked on until
          var ok;
          try { ok = t.yield_.fn(); }
          catch (err) { ok = true; errs('sched', 'until() in "' + t.labelName + '" threw: ' + String((err && err.message) || err)); }
          if (!ok) {

    now: function () { return now; },
    delta: function () { return delta; },
    count: function () { return tasks.length; },

    get speed() { return speed; },
    set speed(v) { speed = Math.min(8, Math.max(0.5, Number(v) || 1)); },
    get paused() { return paused; },
    set paused(v) { paused = !!v; }
  };
})();

    'uniform sampler2D tDepth;',
    'uniform sampler2D tBayer;',

    'vec3 oklab(vec3 lin){',
    '  float l = 0.4122214708*lin.r + 0.5363325363*lin.g + 0.0514459929*lin.b;',
    '  float m = 0.2119034982*lin.r + 0.6806995451*lin.g + 0.1073969566*lin.b;',
    '  float s = 0.0883024619*lin.r + 0.2817188376*lin.g + 0.6299787005*lin.b;',
    '  vec3 lms = vec3(l,m,s);',
    '  lms = sign(lms)*pow(abs(lms), vec3(1.0/3.0));',
    '  return vec3(',
    '    0.2104542553*lms.x + 0.7936177850*lms.y - 0.0040720468*lms.z,',
    '    1.9779984951*lms.x - 2.4285922050*lms.y + 0.4505937099*lms.z,',
    '    0.0259040371*lms.x + 0.7827717662*lms.y - 0.8086757660*lms.z);',
    '}',
    'vec3 snapPalette(vec3 col){',
    '  vec3 L = oklab(srgb2lin(col));',
    '  float best = 1e12; float bi = 0.0;',
    '  for (int i = 0; i < 90; i++){',
    '    vec3 pc = texture2D(tPal, vec2((float(i)+0.5)/90.0, 0.5)).rgb;',

    '    float dist = dot(d,d);',

    '  }',
    '  return texture2D(tPal, vec2((bi+0.5)/90.0, 0.5)).rgb;',
    '}',
    '',
    'void main(){',
    '  vec2 uvPix = vUv;',
    '  vec3 col = texture2D(tColor, uvPix).rgb;',
    '  float depth = texture2D(tDepth, uvPix).x;',

    '  float dL = texture2D(tDepth, uvPix + vec2(-uTexel.x, 0.0)).x;',

    tv:    { fit: 15, target: [0, 1.6, 0] },

  // ---------- bounce marks ----------
  function buildMarks() {

    marks = new THREE.InstancedMesh(geo, matMark, MARKS_MAX);
    marks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    var z0 = new THREE.Matrix4().makeScale(0, 0, 0);
    for (var i = 0; i < MARKS_MAX; i++) {
      marks.setMatrixAt(i, z0);

    }

  function mark(x, z, kind, ang) {
    var i;
    for (i = 0; i < MARKS_MAX; i++) if (markSlots[i].age > MARK_LIFE) break;
    if (i >= MARKS_MAX) i = Math.floor(Math.random() * MARKS_MAX);
    var s = markSlots[i];
    s.age = 0; s.ang = ang || 0; s.x = x; s.z = z;
    if (kind === 'skid') { s.sx = 0.48; s.sz = 0.14; } else { s.sx = s.sz = 0.16; }

    marks.setMatrixAt(i, m);

      { g: new THREE.PlaneGeometry(2 * C.halfW, C.dX - C.singlesX), px: 0, pz: (C.singlesX + C.dX) / 2 },
      { g: new THREE.PlaneGeometry(2 * C.halfW, C.dX - C.singlesX), px: 0, pz: -(C.singlesX + C.dX) / 2 },
      { g: new THREE.PlaneGeometry(12.3 - C.halfW, 2 * C.dX), px: (C.halfW + 12.3) / 2, pz: 0 },
      { g: new THREE.PlaneGeometry(12.3 - C.halfW, 2 * C.dX), px: -(C.halfW + 12.3) / 2, pz: 0 }
    ];
    parts.forEach(function (p) {

    group.add(new THREE.Mesh(HB.UTIL.mergeGeoms(parts), matOut));

    buildNet(); buildBoards(); buildMarks();

    var nav = HB.CORE.nav;
    nav.rect(-12.5, -6.0, 12.5, 6.0, true);                    // slab (players use exact coords)
    nav.rect(16.4, -6.9, 16.7, 6.9, true);                     // board row E (at stand)
    nav.rect(-16.7, -6.9, -16.4, 6.9, true);                   // board row W (at stand)

    HB.CORE.task(function* () {
      while (true) { yield HB.wait(0.25); fadeMarks(0.25); }
    }, { name: 'court:marks', max: 30 });

    HB.bus.on('surface:set', function (d) {

    });
    return api;
  }

  function setSurface(s) {
    if (!PAINT[s] || !matIn) return;
    surface = s;
    matIn.color.set(PAINT[s].in);
    matOut.color.set(PAINT[s].out);

      markSlots[i].age = 1e9;

  }

  }

      linesBounds: { minX: +b.min.x.toFixed(3), maxX: +b.max.x.toFixed(3),

    groundY: function () { return GY; },

})();

// club.js — HB.CLUB (P1b): stands (instanced seats, doll's-house cutaway),

HB.CLUB = (function () {
  var U = HB.UTIL;

  var ledTex, ledCtx, ledMesh, clockTex, clockCtx, flags = [], ledT = 0;

  function tx(x, y, z) { var m = new THREE.Matrix4(); m.makeTranslation(x, y, z); return m; }
  function vcMat() {

      transparent: true });
  }

  // ---- one grandstand: merged steps + instanced seats, tag for cutaway ----
  function stand(len, rows, cols) {
    var grp = new THREE.Group();
    grp.__crowdCfg = { len: len, rows: rows, cols: cols };
    var steps = [], stepH = 0.52, stepD = 0.92;
    for (var r = 0; r < rows; r++)
      steps.push({ g: new THREE.BoxGeometry(len, stepH, stepD),
        m: tx(0, stepH / 2 + r * stepH, r * stepD), color: r % 2 ? '#7d7469' : '#8f8578' });
    steps.push({ g: new THREE.BoxGeometry(len, 1.05, 0.3), m: tx(0, 0.5, -0.15),
      color: '#5e564d' });
    grp.add(new THREE.Mesh(U.mergeGeoms(steps), vcMat()));
    var seatG = new THREE.BoxGeometry(0.46, 0.16, 0.42);   // slim seat pads (structure)
    var seatM = new THREE.MeshLambertMaterial({ color: '#39424e', transparent: true });
    var n = rows * cols, im = new THREE.InstancedMesh(seatG, seatM, n);
    im.instanceMatrix.setUsage(THREE.StaticDrawUsage);

    var m4 = new THREE.Matrix4(), col = new THREE.Color();
    var pitch = len / cols, i = 0;
    for (var rr = 0; rr < rows; rr++)
      for (var cc = 0; cc < cols; cc++) {
        m4.makeTranslation(-len / 2 + pitch * (cc + 0.5), stepH * rr + stepH + 0.25,
          rr * stepD + stepD / 2);
        im.setMatrixAt(i, m4);
        col.set(ACC[(i * 7 + rr * 3) % ACC.length]);
        im.setColorAt(i, col);
        i++;
      }
    im.instanceColor.needsUpdate = true;
    grp.add(im);
    grp.__seats = im;
    grp.__mats = [grp.children[0].material, seatM];
    grp.__cutQ = 0;                       // real quad assigned in buildStands()
    return grp;

  function buildStands() {
    // long axis of court is X: big stands on N/S sidelines, small on baseline ends
    function place(grp, x, z, ry, quad, phi) {
      grp.position.set(x, 0, z); grp.rotation.y = ry; G.add(grp);
      cut.push({ grp: grp, k: 0, phi: phi, __cut: { quad: quad },

    place(stand(16, 4, 12), 16.9, 0, Math.PI / 2, 1, Math.PI / 2);   // east baseline

  }

    for (var i = 0; i < 1200; i++) {

      var ax = -KDRAG * sp * vel.x + KMAG * (w.y * vel.z - w.z * vel.y);
      var ay = -G - KDRAG * sp * vel.y + KMAG * (w.z * vel.x - w.x * vel.z);
      var az = -KDRAG * sp * vel.z + KMAG * (w.x * vel.y - w.y * vel.x);
      vel.x += ax * dt; vel.y += ay * dt; vel.z += az * dt;
      var lastX = p.x, lastY = p.y, lastZ = p.z;
      p.x += vel.x * dt; p.y += vel.y * dt; p.z += vel.z * dt;
      t += dt;
      if (p.y > apex) apex = p.y;
      if (yNet === null && Math.sign(p.x) !== Math.sign(dirSign)) {
        var k = (0 - lastX) / ((p.x - lastX) || 1e-9);
        yNet = lastY + (p.y - lastY) * k;
        tNet = t;
      }
      if (p.y <= groundY) break;
    }
    return { pos: p, vel: vel, apex: apex, yNet: yNet, tNet: tNet, t: t };
  }

  // vy profile FIXED at seed speed (default 30 m/s mid-arc); only the horizontal
  // component scales during bisection — otherwise fast seeds flatten out short.
  function makeVFactory(start, dir, spinTop, dist) {
    var tSeed = HB.UTIL.clamp(dist / 30, 0.5, 1.6);
    var vy = HB.UTIL.clamp(
      (0.25 - start.y + 0.5 * G * tSeed * tSeed) / tSeed - (spinTop || 0) * 0.0022,
      0.4, 3.4);
    return function (speed) {
      return new THREE.Vector3(dir.x * speed, vy, dir.z * speed);
    };
  }

  // solve(aim): {start, target, spin{top,side}, clearance, Tscale}
  function solve(aim) {
    var start = V(aim.start);
    var target = V(aim.target); target.y = 0.03;
    var spin = aim.spin || { top: 0, side: 0 };
    var groundY = 0.03;
    var clearance = aim.clearance != null ? aim.clearance : 0.35;
    var dir = new THREE.Vector3(target.x - start.x, 0, target.z - start.z);
    var dist = dir.length(); dir.normalize();
    // Magnus axes (SHARED with ball.js — see syncW below): topspin = negative rate
    // about −Z for +x travel (dips), sidespin about Y curves.
    var w = syncW(spin, dir.x);

    // 1) bisection on SPEED at fixed vy profile
    var vmk = makeVFactory(start, dir, spin.top, dist);
    var lo = 10, hi = 62, best = null;
    for (var iter = 0; iter < 30; iter++) {
      var mid = (lo + hi) / 2;
      var v0 = vmk(mid);
      var f = flight(start, v0, w, groundY, 0, dir.x);
      var reach = Math.hypot(f.pos.x - start.x, f.pos.z - start.z);
      best = { v0: v0, f: f };
      if (reach < dist - 0.25) lo = mid;         // too short → faster
      else if (reach > dist + 0.25) hi = mid;    // too long → slower
      else break;                                 // landed within 0.25 m
    }
    var v0 = best.v0, f = best.f;
    // 2) clearance pass: if net-cross below wanted, raise vy (re-bisect once)
    var tries = 0;
    while ((f.yNet === null || f.yNet < clearance) && tries++ < 6) {
      v0.y += 0.28;
      f = flight(start, v0, w, groundY, 0, dir.x);
      // keep it landing near target: retrim speed after vy bump
      var reach = Math.hypot(f.pos.x - start.x, f.pos.z - start.z);
      if (reach > dist + 0.6) { v0.x -= dir.x * (reach - dist) / f.t * f.t; }
    }
    return {
      v0: v0.clone(), w: w.clone(), hitTime: f.t, netT: f.tNet, apex: f.apex,
      landing: f.pos.clone(), netY: f.yNet
    };
  }

  return { solve: solve, flight: flight, syncW: syncW };
})();

// ball.js — HB.BALL (P4): ball mesh + substepped physics (1/120 s) with per-surface
// bounce, net plane + cord collision, bounce marks, BUS events (ARCH §11).
HB.BALL = (function () {
  var mesh, shadow;
  var st = { inPlay: false, p: new THREE.Vector3(), v: new THREE.Vector3(),
             w: new THREE.Vector3(), marksOn: true };
  var SUB = 1 / 120;
  var G = 9.81, R = 0.033;

  function surfaceParams(surface) {
    var b = HB.CFG.bounce[surface || HB.CFG.current.surface] || HB.CFG.bounce.hard;
    return b;
  }

  var VISR = 0.05;   // visual radius: physics keeps R=0.033 (drag consts), but a
                     // 3.3 cm ball is a 1-2px dot at pixelSize 2 and the outline
                     // pass swallowed it (same failure as P3b confetti) → 5 cm.
  function build(scene) {
    var g = new THREE.SphereGeometry(VISR, 10, 8);
    mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: '#d7e34c' }));
    mesh.visible = false;
    scene.add(mesh);
    var sg = new THREE.CircleGeometry(VISR * 2.2, 10); sg.rotateX(-Math.PI / 2);
    shadow = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: '#07080a',
      transparent: true, opacity: 0.24, depthWrite: false }));
    shadow.visible = false;
    scene.add(shadow);
    var nav = HB.CORE.nav;
    HB.bus.on('ball:serveReq', function (d) { launch(d); });
    return api;
  }

  function launch(d) {
    st.inPlay = true;
    st.p.copy(d.p); st.v.copy(d.v0);
    // accept spin {top,side} OR a pre-synced world-axis w Vector3
    if (d.w && d.w.isVector3) st.w.copy(d.w);
    else st.w.copy(HB.KIN.syncW(d.spin || { top: 0, side: 0 }, d.v0.x || 1));
    st.netHit = null; st.bounces = 0;
    st.tStart = Date.now();
    mesh.visible = true; shadow.visible = true;
  }
  var ZERO = new THREE.Vector3();

  // net: plane x=0, band from z=−6.4..6.4 (posts), height varies by court.js netCurve
  function netHeightAt(z) {
    var N = HB.COURT.netInfo();
    var postZ = N.centreH !== undefined ? 6.399 : 6.399;
    var ph = 1.07, ch = 0.914;
    var k = Math.pow(Math.abs(z) / postZ, 2);
    return ch + (ph - ch) * k;
  }
  function netZ() { return HB.COURT.netInfo().postZ; }

  function physStep(dt, d) {
    var v = st.v, p = st.p;
    var sp = v.length();
    var kdrag = 0.5 * 1.225 * 0.55 * Math.PI * R * R / 0.057;
    var KM = 0.000457;   // same sigma as kin.js (shared convention)
    var wx = st.w.x, wy = st.w.y, wz = st.w.z;
    v.x += (-kdrag * sp * v.x + KM * (wy * v.z - wz * v.y)) * dt;
    v.y += (-G - kdrag * sp * v.y + KM * (wz * v.x - wx * v.z)) * dt;
    v.z += (-kdrag * sp * v.z + KM * (wx * v.y - wy * v.x)) * dt;
    p.addScaledVector(v, dt);
    // net plane
    var ZN = netZ();
    if (Math.sign(p.x) !== Math.sign(st.lastX || p.x) && p.x !== st.lastX) {
      var t = st.lastX === undefined ? 0 : (0 - (st.lastX)) / ((p.x - st.lastX) || 1e-9);
      if (t >= 0 && t <= 1) {
        var zL = st.lastZ + (p.z - st.lastZ) * t;
        var yL = st.lastY + (p.y - st.lastY) * t;
        if (Math.abs(zL) <= ZN && yL < netHeightAt(zL) + 0.02) {
          if (yL > netHeightAt(zL) - 0.11) {           // cord clip
            st.p.set(st.lastX * (1 - t), Math.max(yL, 0.55), zL);
            st.v.set(st.v.x * -0.12, 2.2, st.v.z * 0.45);
            st.w.multiplyScalar(0.3);
            HB.bus.emit('ball:netcord', { clip: true });
          } else {                                     // into the net
            st.p.set(st.lastX * (0.96), yL, zL);
            st.v.multiplyScalar(-0.04); st.v.y = 0;
            HB.bus.emit('ball:netcord', { clip: false });
          }
          st.netHit = true;
          return;
        }
      }
    }
    // ground — only inside the island ellipse; off the edge the ball falls
    // into the void (reset/watchdog handles recovery, ARCH §11 ball-lost).
    var onIsland = (p.x * p.x) / (HB.CFG.island.rx * HB.CFG.island.rx) +
                   (p.z * p.z) / (HB.CFG.island.rz * HB.CFG.island.rz) <= 1;
    if (p.y <= 0.036 && v.y < 0 && onIsland) {
      var SP = surfaceParams();
      p.y = 0.036;
      var vin = v.y;
      v.y = -v.y * SP.rest;
      // spin→velocity exchange (skid/roll)
      var surf_v = SP.roll * v.y / 0.033;
      v.x += (st.w.z) * 0.0004 * SP.mu * 60 * SP.skid;
      v.z += (-st.w.x) * 0.0004 * SP.mu * 60 * SP.skid;
      // spin decay
      st.w.multiplyScalar(1 - SP.mu * 2.2 * dt);
      v.x *= (1 - SP.skid * 0.28 * dt * 60 * 0.016);
      v.z *= (1 - SP.skid * 0.28 * dt * 60 * 0.016);
      HB.bus.emit('ball:bounce', { surface: HB.CFG.current.surface,
        vy: +vin.toFixed(2), loc: [+(p.x).toFixed(1), +(p.z).toFixed(1)], bounces: ++st.bounces });
      if (st.marksOn && HB.COURT.ready)
        HB.COURT.mark(p.x, p.z, Math.abs(st.w.x) > 90 ? 'skid' : 'dot',
          Math.atan2(v.z, v.x));
    }
    st.lastX = p.x; st.lastY = p.y; st.lastZ = p.z;
  }

    if (!st.inPlay) return;

    while (dt > 0 && acc < 0.25) {                 // catch-up cap
      var h = Math.min(SUB, dt);
      physStep(h);
      dt -= h; acc += h;
      if (st.netHit) { st.netHit = false; }
    }
    if (st.p.length() > 200 || st.p.y < -20 ||
        Date.now() - (st.tStart || 0) > 12000) reset(true);
    mesh.position.copy(st.p);
    shadow.position.set(st.p.x, 0.041, st.p.z);
    var sc = HB.UTIL.clamp(1 - st.p.y / 9, 0.35, 1);
    shadow.scale.set(sc, sc, sc);
    mesh.rotation.x += st.w.z * dt; mesh.rotation.y += st.w.x * dt;
  }

  function reset(lost) {
    st.inPlay = false;
    mesh.visible = false; shadow.visible = false;
    if (lost) HB.bus.emit('debug:balllost', { at: st.p.toArray() });
  }
  function show() { mesh.visible = true; shadow.visible = true; }
  function hide() { mesh.visible = false; shadow.visible = false; }

  var api = {
    ready: true, build: build, launch: launch, step: step, reset: reset,
    show: show, hide: hide,
    state: function () { return { inPlay: st.inPlay, p: st.p.toArray(), v: st.v.toArray() }; }
  };
  HB.reg('ball', api);
  return api;
})();
// ===== rally.js =====
// rally.js — HB.RALLY (P4b/P6): shot-choice + error model + calibration harness.
// Headless point sim: serve->return->rally ... -> point end. Uses KIN solver +
// simplified outcome model (contact quality -> real miss geometry). Statistical
// targets: 1st-serve 60-65%, aces 4-8%, DF 2-4%, mean rally 4-7 shots (ARCH §11).
HB.RALLY = (function () {
  var U = HB.UTIL;

  // Draw one value from an existing (stateful) generator OR a raw seed. P4b ROOT
  // CAUSE FIX: code used to call U.rng(meta.r)() — mulberry32 coerces a function
  // seed to 0, so EVERY roll returned the same first constant from seed 0: matches
  // froze at cap-40 rallies, aces never fired, 1st-serve pinned at 100 %. Never
  // re-seed with a generator — draw through roll().
  function roll(r) { return (typeof r === 'function') ? r() : U.rng(r)(); }

  // ---------- decision model ----------
  // returns {target:{x,z}, spin:{top,side}, clearance, Tscale, kind}
  function chooseShot(p, meta) {
    // court-local: p is ball contact {x,z}; pick placement
    var deepX = 6.5 + roll(meta.r) * 3.5;            // depth 6.5..10 (past service 6.4)
    var wideZ = 2.0 + roll(meta.r) * 1.6;            // z 2..3.6 (open court)
    var lineZ = 0.4 + roll(meta.r) * 0.9;
    var z = (roll(meta.r) < 0.62) ? (roll(meta.r) < 0.5 ? wideZ : -wideZ) : lineZ * (meta.side || 1);
    var risk = meta.player.tactic.risk / 100;
    var topRate = (meta.player.tactic.net > 45) ? -1600 - risk * 1800 : -700 - risk * 900;
    return { target: { x: deepX * (1 + meta.player.tactic.cons / 400), z: z },
             spin: { top: topRate, side: 0 }, clearance: 0.4 + risk * 0.5,
             Tscale: 1, kind: 'ground' };
  }

  // ---------- outcome: contact quality -> real miss ----------
  // Consistency: error prob rises with risk and power, falls with cons.
  function contactErr(meta, kind) {
    var risk = meta.player.tactic.risk / 100;
    var cons = meta.player.cons / 100;
    var base = kind === 'serve' ? 0.28 : 0.115;
    var p = base * (0.55 + risk * 0.9) * (1.35 - cons);
    return roll(meta.r) < p;
  }
  function missGeom(meta, shot) {  // turns an error into a REAL geometry miss
    var side = roll(meta.r) < 0.5 ? 1 : -1;
    var kind = roll(meta.r) < 0.45 ? 'long' : 'wide';
    if (kind === 'long') shot.target.x += side > 0 ? 1.1 + roll(meta.r) : -(0.9 + roll(meta.r));
    else shot.target.z += side * (0.55 + roll(meta.r) * 0.5);
    if (roll(meta.r) < 0.22) shot.target.x = (shot.target.x > 0 ? 1 : -1) * -0.4; // netted
    return shot;
  }

  // ---------- headless point sim ----------
  // Statistical twin of the on-court loop (FLOW drives the real one). Every roll is
  // a FRESH draw — no shared meta.r correlation. Surface effect: rally stop-prob
  // scales with CFG.bounce[surf].speedMix (clay 0.93 lengthens, carpet 1.05 shortens).
  var TUNE = {
    pErrBase: 0.26,     // unforced error / contact at avg attrs (calibrated P4b)
    pWinBase: 0.065,    // clean winner / contact at avg attrs
    retErrMul: 1.55,    // return of serve is the hardest contact
    rallyCap: 40
  };
  function simPoint(ps, server, opts) {
    opts = opts || {};
    var surf = opts.surface || 'hard';
    var SP = HB.CFG.bounce[surf] || HB.CFG.bounce.hard;
    var adj = SP.speedMix;
    var sp = ps[server], rc = ps[1 - server];
    var S = sp.player.serve;
    var cs = sp.player.cons / 100;

    // serve: attempt 1 (60-65% in, by consistency), then attempt 2
    var p1stIn = 0.615 + 0.05 * (cs - 0.5);
    var p2ndMiss = U.clamp(0.10 - cs * 0.06 + S.dRate * 0.5, 0.03, 0.14);
    var s1In = roll(sp.r) < p1stIn;
    var s1InFlag = s1In ? 1 : 0;
    if (!(s1In || roll(sp.r) >= p2ndMiss))
      return { winner: 1 - server, how: 'double-fault', shots: 0,
               stats: { s1In: s1InFlag, df: 1 } };
    // ace: strong serve/placement vs returner consistency; mostly off 1st serves
    var ace = roll(rc.r) < aceProb(sp, rc) * (s1In ? 1 : 0.45);
    if (ace)
      return { winner: server, how: 'ace', shots: 1,
               stats: { s1In: s1InFlag, ace: 1 } };

    // rally: per-contact error | winner | continue — fresh roll, counting contacts
    var idx = 1 - server;
    for (var shots = 1; shots < TUNE.rallyCap; shots++) {
      var m = ps[idx], ret = (shots === 1);           // first rally contact = return
      var risk = m.player.tactic.risk / 100, cons = m.player.cons / 100;
      var pE = TUNE.pErrBase * (0.60 + risk * 0.8) * (1.25 - cons) *
               (ret ? TUNE.retErrMul : 1) * adj;
      var pW = TUNE.pWinBase * (1.10 - cons * 0.30) * adj;
      var u = roll(m.r);
      var base = { stats: { s1In: s1InFlag } };
      if (u < pE) {
        base.winner = 1 - idx; base.how = ret ? 'return-err' : 'error';
        base.shots = shots + 1; return base;
      }
      if (u < pE + pW) {
        base.winner = idx; base.how = 'winner';
        base.shots = shots + 1; return base;
      }
      idx = 1 - idx;                                  // ball back
    }
    return { winner: server, how: 'long-rally', shots: TUNE.rallyCap,
             stats: { s1In: s1InFlag } };
  }
  function aceProb(server, receiver) {
    // strong serve + weak returner -> more aces; tuned for 4–8 % band
    var pow = server.player.pow / 100, place = server.player.place / 100;
    var ret = 0.031 + pow * 0.054 * place - (receiver.player.cons / 100) * 0.016;
    return U.clamp(ret, 0.012, 0.11);
  }

  // ---------- calibration harness (P4b / ARCH §11) ----------
  // n points per surface. firstServePct = 1st ATTEMPTS that went in (excl. 2nd serves);
  // seeds differ per surface AND pairing so each cell is an independent sample.
  function calibrate(n, onDone) {
    n = n || 2000;
    var out = {};
    HB.CFG.surfaces.forEach(function (sf, j) {
      var st = { pts: 0, s1: 0, s1In: 0, aces: 0, dfs: 0, rally: 0 };
      for (var i = 0; i < 4; i++) {      // 4 pairings × n/4 points
        var a = HB.CFG.roster[i], b = HB.CFG.roster[(i + 1) % 4];
        var ps = prep(a, b, 1000 + j * 911 + i * 77, sf);
        for (var k = 0; k < n / 4; k++) {
          var res = simPoint(ps, k % 2, { surface: sf });
          st.pts++;
          st.s1++;
          if (res.stats.s1In) st.s1In++;
          if (res.how === 'ace') st.aces++;
          if (res.how === 'double-fault') st.dfs++;
          st.rally += res.shots;
        }
      }
      out[sf] = {
        points: st.pts,
        firstServePct: +(100 * st.s1In / st.s1).toFixed(1),
        acePct: +(100 * st.aces / st.pts).toFixed(1),
        dfPct: +(100 * st.dfs / st.pts).toFixed(1),
        meanRally: +(st.rally / st.pts).toFixed(2)
      };
    });
    if (onDone) onDone(out);
    return out;
  }
  function prep(a, b, seed, surface) {
    function mk(p, s0) {
      return { player: p, r: U.rng(s0), side: 1 };
    }
    // simPoint uses ps[server]/ps[receiver]; serve side flips handled inside.
    return [mk(a, seed), mk(b, seed + 1)];
  }

  var api = {
    ready: true, chooseShot: chooseShot, contactErr: contactErr, missGeom: missGeom,
    simPoint: simPoint, calibrate: calibrate
  };
  HB.reg('rally', api);
  return api;
})();

// flow.js — HB.FLOW (P5): match flow (ARCH §8/§10, CONTRACT §3/§7).
// Pure scoring engine (FAST4 / one set / bo3 + super-tb) + on-court coroutine:
// walk-on → toss → points (serve faults/lets, real-physics rallies, line calls,
// bounce-2 verdicts) → changeovers → tie-breaks → handshake → trophy. BUS-only.
HB.FLOW = (function () {
  var U = HB.UTIL;
  var CH = HB.CFG.COURT;
  var HALF = CH.halfW, SX = CH.singlesX, SRVX = 6.4;

  // ============ pure scoring engine ============
  function newMatch(fmt, metas, surface) {
    return {
      format: fmt, surface: surface || HB.CFG.current.surface,
      players: [{ meta: metas[0] }, { meta: metas[1] }],
      firstServer: 0, server: 0, ends: 0, gameNo: 0, state: 'idle',
      score: { ptsRaw: [0, 0], gamesNow: [0, 0], sets: [0, 0], tb: null, ptNo: 0 },
      stats: { firstIn: 0, firstTot: 0, aces: 0, dfs: 0,
               fastest: { kph: 0, who: -1 }, rallyShots: [], winners: [], errors: [] },
      reviews: { left: [3, 3], log: [] }
    };
  }
  function ptsLabel(v) { return ['0', '15', '30', '40', 'AD'][Math.min(v, 4)]; }

  // advance scoring one point (winner w). Pure except M.gameNo/M.score mutation.
  function scorePoint(M, w) {
    var out = { gameOver: false, setOver: false, matchOver: false, tbStart: false, msg: '' };
    if (M.matchOver) return out;
    var S = M.score;
    var GT = (M.format === 'short') ? 4 : 6;
    var TBAT = (M.format === 'short') ? 3 : 6;
    if (S.tb) {                                              // tie-break point
      S.tb.pts[w]++;

      var a = S.tb.pts[0], b = S.tb.pts[1], tgt = S.tb.target;
      if ((a >= tgt || b >= tgt) && Math.abs(a - b) >= 2) {
        var wi = a > b ? 0 : 1;

        out.setOver = true;                                  // tb always completes the set
        M.score.sets[wi]++;
        S.gamesNow = [0, 0];
        if (M.format === 'bo3' ? M.score.sets[wi] >= 2 : true) out.matchOver = true;
        out.msg = 'SET & MATCH — ' + (out.matchOver ? M.players[wi].meta.name : '');
        if (!out.matchOver) out.msg = 'SET — ' + M.players[wi].meta.name;
      }
      return out;
    }
    S.ptsRaw[w] = S.ptsRaw[w] + 1;              // unbounded: 5-4 = AD, 6-5, 6-6→game
    var p = S.ptsRaw;                           // (clamping to 4 froze every deuce forever)
    if (p[w] >= 4 && p[w] - p[1 - w] >= 2) {                 // game won
      out.gameOver = true; M.gameNo++;
      S.ptsRaw = [0, 0];
      S.gamesNow[w]++;

      // Set over: reached GT with a 2-game margin, or one PAST TBAT (7-5 /
      // FAST4 4-3). 6-5 continues; 6-6 / 3-3 → tie-break branch below.
      if (g[w] >= GT && (g[w] > TBAT || g[w] - g[1 - w] >= 2)) {
        out.setOver = true;
        M.score.sets[w]++;
        S.games = g.slice();
        S.gamesNow = [0, 0];
        if (M.format === 'bo3' ? M.score.sets[w] >= 2 : true) out.matchOver = true;
        out.msg = (out.matchOver ? 'MATCH — ' : 'SET — ') + M.players[w].meta.name;
      } else if (g[0] === TBAT && g[1] === TBAT) {
        out.tbStart = true;
        // FAST4 tie-break is to 5 (official rule); set tb 7; bo3 decider super-tb 10
        var tgt2 = (M.format === 'short') ? 5 :
          (M.format === 'bo3' && M.score.sets[0] === 1 && M.score.sets[1] === 1) ? 10 : 7;
        S.tb = { pts: [0, 0], target: tgt2, first: (M.firstServer + M.gameNo) % 2 };
        out.msg = 'TIE-BREAK';
      } else {
        out.msg = 'GAME — ' + M.players[w].meta.name;
      }
      return out;
    }
    if (p[0] >= 3 && p[1] >= 3)
      out.msg = p[0] === p[1] ? 'DEUCE' :
        'ADVANTAGE ' + M.players[p[0] > p[1] ? 0 : 1].meta.name;

    c.spin = Math.random() * 6;
  }
  function respawn(k, c) { c.pos.y = 8 + Math.random() * 3; c.vel.y = 1 + Math.random(); }
  function confetti() {
    var m = new THREE.Matrix4();
    for (var k = 0; k < CONFETTI_N; k++) {
      var c = confData[k];
      spawnOne(k, c);
      m.compose(c.pos, new THREE.Quaternion(), new THREE.Vector3(1, 1, 1));
      conf.setMatrixAt(k, m);
    }
    conf.instanceMatrix.needsUpdate = true;
  }

  var api = { ready: true, build: build, confetti: confetti,
    excite: function (v) { HB.bus.emit('crowd:react', { level: v }); } };
  HB.reg('crowd', api);
  return api;
})();
// ===== ui.js =====
// ui.js — HB.UI: panel wiring stub for P0 (slider live-RT, mode buttons, selects → BUS).
// Scoreboard/feed/match-centre logic arrives in P5/P6; coach controls enable in P6.
HB.UI = (function () {
  function $(id) { return document.getElementById(id); }

  function init() {
    var p = HB.DEBUG.params;
    if (p.nomenu === '1' || p.nomenu === true) document.body.classList.add('nomenu');
    if (p.layout === 'phone') document.body.classList.add('phone');

    // roster pickers
    var p0 = $('p0'), p1 = $('p1');
    if (p0 && p1) {
      HB.CFG.roster.forEach(function (r, i) {
        p0.add(new Option(r.name, r.id, i === 0, i === 0));
        p1.add(new Option(r.name, r.id, i === 1, i === 1));
      });
      if (p0.options.length > 1) p1.selectedIndex = 1;
    }

    // pixel size → live RT resize (QA-P0 gate)
    var pix = $('pix'), pixV = $('pixV');
    if (pix) {
      pix.value = HB.CORE.pipeline.P.pixelSize;
      pixV.textContent = pix.value;
      pix.addEventListener('input', function () {
        HB.CORE.pipeline.setPixelSize(parseInt(pix.value, 10));
        pixV.textContent = pix.value;
      });
    }

    // speed / pause
    var spd = $('spd'), spdV = $('spdV'), pause = $('btnPause');
    if (spd) spd.addEventListener('input', function () {
      HB.CORE.speed = parseFloat(spd.value);
      spdV.textContent = spd.value + '×';
    });
    if (pause) pause.addEventListener('click', function () {
      HB.CORE.paused = !HB.CORE.paused;
      pause.textContent = HB.CORE.paused ? 'Resume' : 'Pause';
      pause.classList.toggle('on', HB.CORE.paused);
    });

    // surface / tod → BUS (court/light listen; stubs ignore for now)
    var surf = $('surf'), tod = $('tod');
    if (surf) surf.addEventListener('change', function () {
      HB.CFG.current.surface = surf.value;
      HB.bus.emit('surface:set', { surface: surf.value });
    });
    if (tod) tod.addEventListener('change', function () {
      HB.CFG.current.tod = tod.value;
      HB.bus.emit('tod:set', { tod: tod.value });
    });

    // camera mode buttons
    Array.prototype.forEach.call(document.querySelectorAll('#camMode button'),
      function (b) {
        b.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('#camMode button'),
            function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          HB.CORE.camera.setMode(b.getAttribute('data-cam'));
        });
      });

    // new match → FLOW.startMatch with picked roster + format
    var btnNew = $('btnNew');
    if (btnNew) btnNew.addEventListener('click', function () {
      HB.bus.emit('ui:newmatch', { fmt: $('fmt') && $('fmt').value,
        p0: p0 && p0.value, p1: p1 && p1.value });
    });

    // ---- P5: feed + scoreboard + match centre ----
    var feed = $('feed'), sb = $('scoreboard'), stats = $('stats');
    function pushLog(t, cls) {
      if (!feed) return;
      var li = document.createElement('li');
      if (/^OUT|Fault|Double|Let|Watchdog/i.test(t)) li.className = 'warn';
      if (cls) li.className = cls;
      li.innerHTML = '<span class="t">' + sbClock() + '</span>' + t;
      feed.insertBefore(li, feed.firstChild);
      while (feed.children.length > 60) feed.removeChild(feed.lastChild);
    }
    function sbClock() {
      var s = Math.floor(HB.CORE.sched.now() % 86400);
      var m = Math.floor(s / 60) % 60, h = Math.floor(s / 3600) % 24;
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    function byId(v) {
      for (var i = 0; i < HB.CFG.roster.length; i++)
        if (HB.CFG.roster[i].id === v) return HB.CFG.roster[i];
      return null;
    }
    function renderSB(M) {
      if (!sb || !M) return;
      sb.classList.add('on');
      var t = HB.FLOW.scoreText(M);
      for (var i = 0; i < 2; i++) {
        sb.querySelector('[data-sb="name' + i + '"]').textContent = M.players[i].meta.name.split(' ').pop();
        sb.querySelector('[data-sb="srv' + i + '"]').textContent =
          (M.state === 'live' && M.server === i) ? '●' : '';
        sb.querySelector('[data-sb="ptr' + i + '"]').textContent = M.score.tb ? M.score.tb.pts[i] : t.ptr.split('–')[i];
      }
      sb.querySelector('[data-sb="games"]').textContent = t.games;
      sb.querySelector('[data-sb="sets"]').textContent = M.score.sets.join('–');
    }
    HB.bus.on('ui:log', function (d) { pushLog(d.t, d.cls); });
    HB.bus.on('call:umpire', function (d) { pushLog('⟡ ' + d.text); });
    HB.bus.on('call:line', function (d) { pushLog('OUT — ' + d.loc.map(function (v) { return v.toFixed(1); }).join(', ')); });
    HB.bus.on('match:watchdog', function (d) {
      pushLog('Watchdog — ' + d.task + ' stalled ' + d.blocked + ' s; force-resumed.', 'warn');
    });
    HB.bus.on('match:new', function (d) {
      if (stats) stats.textContent = 'New ' + d.fmt + ' match — walk-on.';
    });
    HB.bus.on('match:phase', function (d) { if (d.phase === 'live' && curM()) renderSB(curM()); });
    HB.bus.on('point:end', function (d) {
      var M = curM();
      if (!M) return;
      renderSB(M);
      var names = [M.players[0].meta.name.split(' ').pop(), M.players[1].meta.name.split(' ').pop()];
      pushLog(names[d.winner] + ' wins the point (' + d.how + (d.shots ? ', ' + d.shots + ' shots' : '') + ').');
      if (stats) {
        var S = M.stats, tot = S.rallyShots.length || 1, sum = 0;
        S.rallyShots.forEach(function (v) { sum += v; });
        stats.innerHTML =
          '<b>' + M.players[0].meta.name + '</b> vs <b>' + M.players[1].meta.name + '</b><br>' +
          'Sets ' + M.score.sets[0] + '–' + M.score.sets[1] +
          ' · Games ' + M.score.gamesNow[0] + '–' + M.score.gamesNow[1] + '<br>' +
          '1st in ' + (S.firstTot ? Math.round(100 * S.firstIn / S.firstTot) + '%' : '—') +
          ' · Aces ' + S.aces + ' · DF ' + S.dfs + '<br>' +
          'Mean rally ' + (sum / tot).toFixed(1) +
          ' · Fastest ' + (S.fastest.kph || '—') + ' kph' +
          (S.fastest.who >= 0 ? ' (' + M.players[S.fastest.who].meta.name.split(' ').pop() + ')' : '');
      }
    });
    HB.bus.on('match:end', function (d) {
      if (stats && curM()) {
        var M = curM();
        stats.innerHTML += '<br><b>CHAMPION: ' + M.players[d.winner].meta.name + '</b>';
      }
    });
    function curM() { return HB.FLOW.current(); }

    HB.bus.emit('ui:ready', {});
  }

  var api = { init: init };
  HB.reg('ui', api);
  return api;
})();
// ===== boot.js =====
// boot.js — scene assembly + main loop (ARCH §2). Order: pipeline → scene/light →
// camera → UI. Placeholder island top so QA-P0 has visible geometry before P1b.
HB.CORE.boot = (function () {
  var scene, clock, raf = 0;

  function buildScene() {
    scene = new THREE.Scene();
    HB.CORE.scene = scene;                      // world modules attach meshes here
    // placeholder island top (P1b replaces with full island):
    var g = new THREE.CircleGeometry(1, 48);
    g.scale(HB.CFG.island.rx, HB.CFG.island.rz, 1);
    g.rotateX(-Math.PI / 2);
    var m = new THREE.MeshLambertMaterial({ color: 0x2a6a26 });
    var isl = new THREE.Mesh(g, m);
    isl.name = 'islandTop';
    scene.add(isl);
    var rock = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 0.55, HB.CFG.island.rockDepth, 48, 1, true),
      new THREE.MeshLambertMaterial({ color: 0x39424e, side: THREE.DoubleSide }));
    rock.geometry.scale(HB.CFG.island.rx, 1, HB.CFG.island.rz);
    rock.name = 'islandRock';
    rock.position.y = -HB.CFG.island.rockDepth / 2;
    scene.add(rock);
  }

  function start() {
    var host = document.getElementById('glhost');
    HB.CORE.pipeline.init(host, { dev: HB.DEBUG.dev, pixelSize: 2 });
    buildScene();
    HB.CORE.light.init(scene);
    HB.CORE.camera.init(host);
    HB.UI.init();
    [HB.COURT, HB.GROUNDS, HB.CLUB].forEach(function (m) {
      if (m && m.ready && m.build) m.build(scene);
    });
    if (HB.CROWD && HB.CROWD.ready) HB.CROWD.build(scene);
    if (HB.BALL && HB.BALL.ready) HB.BALL.build(scene);
    if (HB.PEOPLE && HB.PEOPLE.ready) HB.PEOPLE.ready = HB.PEOPLE.ready;  // passive module
    var ps = HB.DEBUG.params.surface;              // forced state (QA shortcut)
    if (ps && HB.CFG.bounce[ps]) {
      HB.CFG.current.surface = ps;
      var sel = document.getElementById('surf');
      if (sel) { sel.value = ps; HB.bus.emit('surface:set', { surface: ps }); }
    }
    // P3 default: the island is inhabited on load — officials + players idle in
    // their pre-match spots (no walking detours at boot; walk-on is FLOW's P5 job).
    HB.PEOPLE.officials();
    HB.PEOPLE.courtActor(HB.CFG.roster[0], -1);
    HB.PEOPLE.courtActor(HB.CFG.roster[1], 1);
    // a single short ambient stroll so the island feels alive (one line judge)
    var ljs = null;
    HB.CORE.task(function* () {
      yield HB.wait(6, 12);
      var bench = HB.CORE.nav.path(2.5, 7.2, -10.5, 7.2);
      if (bench && bench.length > 2) yield* HB.PEOPLE.walkOn([
        { meta: HB.CFG.roster[3], side: 1, from: [2.5, 7.2], to: [-10.5, 7.2] }
      ]);
    }, { name: 'ambient:stroll', max: 40 });
    HB.CORE.nav.rect(-32, -20, 32, -19, true);  // island rim sanity (real layout P1b)

    var fmt = HB.DEBUG.params;                  // QA boot params (ARCH §14)
    if (fmt.ff) HB.CORE.sched.ff(parseFloat(fmt.ff) || 0);
    if (fmt.pix) HB.CORE.pipeline.setPixelSize(parseInt(fmt.pix, 10) || 2);
    if (fmt.speed) HB.CORE.speed = parseFloat(fmt.speed) || 1;
    if (fmt.qa === 'calib') HB.DEBUG.runCalib(parseInt(fmt.n, 10) || 2000);
    if (fmt.qa === 'match') HB.DEBUG.qaMatch();
    if (fmt.qa === 'wd') { // watchdog proof: stall the scheduler's point task
      HB.DEBUG.qaMatch(function () { console.log('qa=wd match done'); });
      var W0 = HB.CORE.sched.wd.point;
      HB.CORE.sched.wd.point = 3;      // 3 s stall ceiling for the test
      setTimeout(function () { HB.CORE.sched.wd.point = W0; }, 2000);
    }

    clock = new THREE.Clock();
    loop();
    HB.bus.emit('world:boot', { when: HB.CORE.sched.now() });
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    var dt = Math.min(clock.getDelta(), 0.1);
    HB.CORE.sched.step(dt);
    HB.CORE.camera.update(dt);
    if (HB.PEOPLE && HB.PEOPLE.pose) {
      var rigs = HB.PEOPLE.actors();
      for (var i = 0; i < rigs.length; i++) HB.PEOPLE.pose(rigs[i], dt);
    }
    if (HB.BALL && HB.BALL.ready) HB.BALL.step(Math.min(dt, 0.1) * HB.CORE.speed);
    HB.CORE.pipeline.render(scene, HB.CORE.camera.object());
  }

  var api = { start: start, scene: function () { return scene; } };
  HB.reg('boot', api);
  return api;
})();

HB.CORE.boot.start();
})();
</script>
